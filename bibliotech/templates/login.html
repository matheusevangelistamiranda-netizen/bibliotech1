<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0F3D3E">
  <title>Entrar · BiblioTech</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/logo-simbolo.svg') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
  <main class="login-card">
    <a class="marca-horizontal marca-login" href="{{ url_for('login') }}">
      <img src="{{ url_for('static', filename='img/logo-simbolo.svg') }}" alt="">
      <span class="marca-palavras"><span class="marca-nome"><span>Biblio</span><em>tech</em></span><small>LIVRARIA</small></span>
    </a>
    <span class="eyebrow">ÁREA DA EQUIPE</span>
    <h1>Bem-vindo de volta</h1>
    <p class="texto-suave">Entre com sua conta de funcionário para continuar.</p>
    {% with mensagens = get_flashed_messages(with_categories=true) %}
      {% for tipo, texto in mensagens %}<p class="aviso {{ tipo }}" role="status">{{ texto }}</p>{% endfor %}
    {% endwith %}
    <form method="post" class="formulario">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="next" value="{{ next }}">
      <label class="campo">Usuário<input name="usuario" autocomplete="username" required autofocus></label>
      <label class="campo">Senha<input type="password" name="senha" autocomplete="current-password" required></label>
      <button class="botao botao-cheio" type="submit">Entrar</button>
    </form>
    <p class="login-nota">O acesso é restrito à equipe da biblioteca.</p>
  </main>
</body>
</html>
